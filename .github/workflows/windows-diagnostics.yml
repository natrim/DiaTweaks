name: Windows port

on:
  push:
    branches: [windows-port]
    paths: ['windows/**', '.github/workflows/windows-diagnostics.yml']
  pull_request:
    paths: ['windows/**', '.github/workflows/windows-diagnostics.yml']

permissions:
  contents: read

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build x64 controller, TAP and tests
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\Common7\Tools\VsDevCmd.bat" -arch=x64 -host_arch=x64
          if errorlevel 1 exit /b 1
          powershell -NoProfile -File windows\Build.ps1
      - name: Check help and invalid arguments without Dia
        shell: pwsh
        run: |
          & .\windows\build\DiaTweaks.exe --help
          if ($LASTEXITCODE -ne 0) { throw 'Help failed.' }
          & .\windows\build\DiaTweaks.exe --hide-unknown
          if ($LASTEXITCODE -ne 1) { throw 'Invalid option was not rejected.' }
          & .\windows\build\DiaTweaks.exe --hide-chat --restore
          if ($LASTEXITCODE -ne 2) { throw 'Conflicting options were not rejected.' }
          & .\windows\build\DiaTweaks.exe --unload --hide-chat
          if ($LASTEXITCODE -ne 2) { throw 'Conflicting unload was not rejected.' }
          & .\windows\build\DiaTweaks.exe --reload --restore
          if ($LASTEXITCODE -ne 2) { throw 'Conflicting reload was not rejected.' }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: DiaTweaks-Windows-x64-experimental
          path: |
            windows/build/DiaTweaks.exe
            windows/build/DiaTweaks.Tap.dll
            windows/README.md
  inspect-script:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect diagnostic in Windows PowerShell 5.1
        shell: powershell
        run: .\windows\tests\inspect.ps1
      - name: Inspect diagnostic in PowerShell 7
        shell: pwsh
        run: .\windows\tests\inspect.ps1
      - name: Validate settings XAML
        shell: pwsh
        run: .\windows\tests\settings.ps1
